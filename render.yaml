services:
  - type: web
    name: point-matrix
    runtime: python
    buildCommand: pip install -r requirements.txt && cd dashboard && bash render-build.sh
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
